<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUA SICK WORLD - Dinosaur Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-bg: #2d3436;
            --pixel-green: #55efc4;
            --pixel-red: #ff7675;
            --pixel-yellow: #ffeaa7;
            --pixel-dark: #1e272e;
        }
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--pixel-dark);
            color: white;
            image-rendering: pixelated;
            user-select: none;
        }
        .pixel-border {
            box-shadow: 
                -4px 0 0 0 black,
                4px 0 0 0 black,
                0 -4px 0 0 black,
                0 4px 0 0 black;
            margin: 4px;
        }
        .pixel-btn {
            transition: transform 0.1s;
            cursor: pointer;
        }
        .pixel-btn:active {
            transform: translateY(4px);
        }
        .dino-card {
            transition: all 0.2s;
        }
        .dino-card:hover {
            transform: scale(1.02);
        }
        /* 状態アイコンのアニメーション */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .status-icon {
            animation: bounce 1s infinite;
        }
        /* 浮き出るテキスト */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        .floating-text {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            font-size: 12px;
            z-index: 50;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        /* スキャンラインエフェクト */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
    <div class="scanlines"></div>

    <!-- Game Container -->
    <div id="game-container" class="w-full max-w-4xl bg-gray-800 p-4 border-4 border-gray-600 rounded-lg shadow-2xl z-10 hidden">
        
        <!-- Header / Stats -->
        <div class="flex flex-wrap justify-between items-center mb-6 bg-gray-900 p-4 pixel-border">
            <h1 class="text-xl md:text-2xl text-green-400 mb-2 md:mb-0">JUA SICK WORLD</h1>
            <div class="flex gap-4 text-xs md:text-sm">
                <div class="text-yellow-400">💰 <span id="funds">1000</span></div>
                <div class="text-blue-400">📅 DAY: <span id="day">1</span></div>
                <div class="text-red-500">💀 DEAD: <span id="dead-count">0</span>/3</div>
            </div>
        </div>

        <!-- Main Grid (Sanctuary) -->
        <div id="sanctuary" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
            <!-- Slots will be generated by JS -->
        </div>

        <!-- Control Panel -->
        <div class="bg-gray-700 p-4 rounded pixel-border">
            <p class="text-xs text-center mb-2 text-gray-300">▼ ツールを選択して恐竜をタップ ▼</p>
            <div class="flex justify-center gap-2 md:gap-4" id="toolbar">
                <button onclick="selectTool('feed')" id="btn-feed" class="pixel-btn bg-orange-600 hover:bg-orange-500 text-white py-3 px-4 rounded border-b-4 border-orange-800 w-full md:w-auto text-xs md:text-sm flex flex-col items-center">
                    <span class="text-xl mb-1">🍖</span>
                    <span>餌<br>-$20</span>
                </button>
                <button onclick="selectTool('heal')" id="btn-heal" class="pixel-btn bg-blue-600 hover:bg-blue-500 text-white py-3 px-4 rounded border-b-4 border-blue-800 w-full md:w-auto text-xs md:text-sm flex flex-col items-center">
                    <span class="text-xl mb-1">💉</span>
                    <span>治療<br>-$50</span>
                </button>
                <button onclick="selectTool('bandage')" id="btn-bandage" class="pixel-btn bg-white hover:bg-gray-100 text-gray-800 py-3 px-4 rounded border-b-4 border-gray-400 w-full md:w-auto text-xs md:text-sm flex flex-col items-center">
                    <span class="text-xl mb-1">🩹</span>
                    <span>包帯<br>-$30</span>
                </button>
                <button onclick="selectTool('remove')" id="btn-remove" class="pixel-btn bg-gray-600 hover:bg-gray-500 text-white py-3 px-4 rounded border-b-4 border-gray-800 w-full md:w-auto text-xs md:text-sm flex flex-col items-center">
                    <span class="text-xl mb-1">⚰️</span>
                    <span>撤去<br>-$100</span>
                </button>
            </div>
            <div id="tool-info" class="text-center mt-2 text-yellow-300 text-xs h-4">
                <!-- Selected tool info appears here -->
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="fixed inset-0 bg-black bg-opacity-90 flex flex-col items-center justify-center z-50">
        <h1 class="text-4xl md:text-6xl text-green-500 mb-4 text-center px-4" style="text-shadow: 4px 4px #000;">JUA SICK<br>WORLD</h1>
        <p class="text-gray-400 mb-8 text-center text-xs md:text-sm px-8 max-w-lg leading-6">
            恐竜たちはすぐに病気になったり怪我をしたりします。<br>
            適切なツールで彼らを生かし、保護区を運営してください。<br>
            <br>
            🍖 餌: 空腹を治す<br>
            💉 治療: 病気(ウイルス)を治す<br>
            🩹 包帯: 怪我を治す
        </p>
        <button onclick="startGame()" class="pixel-btn bg-green-600 hover:bg-green-500 text-white py-4 px-8 rounded border-b-4 border-green-800 text-xl animate-pulse">
            START GAME
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="fixed inset-0 bg-red-900 bg-opacity-90 flex flex-col items-center justify-center z-50 hidden">
        <h1 class="text-4xl md:text-6xl text-white mb-4">GAME OVER</h1>
        <p class="text-xl text-yellow-300 mb-4">生存日数: <span id="final-day">0</span>日</p>
        <p id="game-over-reason" class="text-white mb-8 text-sm"></p>
        <button onclick="location.reload()" class="pixel-btn bg-white text-red-900 py-3 px-6 rounded border-b-4 border-gray-400">
            TRY AGAIN
        </button>
    </div>

    <script>
        // --- Game Config & State ---
        const CONFIG = {
            initialFunds: 1000,
            incomePerDino: 50, // 健全な恐竜1匹あたりの収入(日給)
            maxDead: 3,
            tickRate: 2000, // ms per tick (game speed)
            costs: {
                feed: 20,
                heal: 50,
                bandage: 30,
                remove: 100
            }
        };

        let state = {
            funds: 0,
            day: 1,
            deadCount: 0,
            dinos: [],
            selectedTool: null,
            gameInterval: null,
            dayInterval: null,
            isPlaying: false
        };

        const DINO_TYPES = [
            { name: 'Rex', icon: '🦖', hp: 100, maxHp: 100 },
            { name: 'Sauro', icon: '🦕', hp: 120, maxHp: 120 },
            { name: 'Trike', icon: '🐗', hp: 80, maxHp: 80 }, // Using Boar as chunky dino proxy
            { name: 'Raptor', icon: '🦎', hp: 60, maxHp: 60 }
        ];

        // --- Core Functions ---

        function initGame() {
            state.funds = CONFIG.initialFunds;
            state.day = 1;
            state.deadCount = 0;
            state.dinos = Array(6).fill(null).map(() => createRandomDino());
            state.selectedTool = null;
            state.isPlaying = true;

            updateUI();
            renderSanctuary();
            
            // Loops
            state.gameInterval = setInterval(gameTick, CONFIG.tickRate);
            state.dayInterval = setInterval(advanceDay, 10000); // 10秒で1日経過
        }

        function createRandomDino() {
            const type = DINO_TYPES[Math.floor(Math.random() * DINO_TYPES.length)];
            return {
                id: Math.random().toString(36).substr(2, 9),
                ...type,
                currentHp: type.hp,
                hunger: 0, // 0-100 (100 is starving)
                isSick: false,
                isInjured: false,
                isDead: false
            };
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            initGame();
        }

        function gameOver(reason) {
            state.isPlaying = false;
            clearInterval(state.gameInterval);
            clearInterval(state.dayInterval);
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-day').innerText = state.day;
            document.getElementById('game-over-reason').innerText = reason;
        }

        // --- Game Logic ---

        function gameTick() {
            if (!state.isPlaying) return;

            state.dinos.forEach(dino => {
                if (dino.isDead) return;

                // Hunger Logic
                dino.hunger += 5;
                if (dino.hunger >= 100) {
                    dino.hunger = 100;
                    dino.currentHp -= 10;
                }

                // Sickness Logic (Random chance)
                if (!dino.isSick && Math.random() < 0.1) {
                    dino.isSick = true;
                    showFloatText(dino.id, "SICK!", "text-purple-400");
                }
                if (dino.isSick) dino.currentHp -= 5;

                // Injury Logic (Random chance)
                if (!dino.isInjured && Math.random() < 0.08) {
                    dino.isInjured = true;
                    showFloatText(dino.id, "OUCH!", "text-red-400");
                }
                if (dino.isInjured) dino.currentHp -= 8;

                // Death Check
                if (dino.currentHp <= 0) {
                    dino.currentHp = 0;
                    dino.isDead = true;
                    state.deadCount++;
                    showFloatText(dino.id, "DIED...", "text-gray-500");
                    checkGameOver();
                }
            });

            renderSanctuary();
            updateUI();
        }

        function advanceDay() {
            if (!state.isPlaying) return;
            state.day++;
            
            // Income calculation
            let income = 0;
            state.dinos.forEach(dino => {
                if (!dino.isDead && !dino.isSick && !dino.isInjured && dino.hunger < 50) {
                    income += CONFIG.incomePerDino;
                }
            });
            
            if (income > 0) {
                state.funds += income;
                showGlobalFloatText(`Income: +$${income}`);
            }

            updateUI();
        }

        function checkGameOver() {
            if (state.deadCount >= CONFIG.maxDead) {
                gameOver("飼育崩壊: 死んでしまった恐竜が多すぎます...");
            } else if (state.funds < 0) {
                gameOver("破産: 資金が尽きました...");
            }
        }

        // --- Interaction ---

        function selectTool(toolName) {
            state.selectedTool = toolName;
            
            // Reset button styles
            ['feed', 'heal', 'bandage', 'remove'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                btn.classList.remove('ring-4', 'ring-yellow-400');
            });

            // Highlight selected
            if (toolName) {
                document.getElementById(`btn-${toolName}`).classList.add('ring-4', 'ring-yellow-400');
                
                const labels = {
                    'feed': '選択中: 餌 (空腹を回復)',
                    'heal': '選択中: 注射 (病気を治療)',
                    'bandage': '選択中: 包帯 (怪我を治療)',
                    'remove': '選択中: 撤去 (遺体を片付ける)'
                };
                document.getElementById('tool-info').innerText = labels[toolName];
            }
        }

        window.handleDinoClick = function(index) {
            if (!state.isPlaying || !state.selectedTool) return;

            const dino = state.dinos[index];
            const cost = CONFIG.costs[state.selectedTool];

            if (state.funds < cost) {
                showFloatText(dino.id, "No Money!", "text-red-500");
                return;
            }

            let actionSuccess = false;

            if (state.selectedTool === 'remove') {
                if (dino.isDead) {
                    // Replace with new dino
                    state.funds -= cost;
                    state.dinos[index] = createRandomDino();
                    showFloatText(state.dinos[index].id, "NEW DINO!", "text-green-400");
                    actionSuccess = true;
                } else {
                    showFloatText(dino.id, "Still Alive!", "text-white");
                }
            } else if (!dino.isDead) {
                if (state.selectedTool === 'feed') {
                    if (dino.hunger > 0) {
                        state.funds -= cost;
                        dino.hunger = Math.max(0, dino.hunger - 50);
                        dino.currentHp = Math.min(dino.maxHp, dino.currentHp + 10);
                        showFloatText(dino.id, "Yummy!", "text-green-400");
                        actionSuccess = true;
                    } else {
                        showFloatText(dino.id, "Full!", "text-gray-400");
                    }
                } else if (state.selectedTool === 'heal') {
                    if (dino.isSick) {
                        state.funds -= cost;
                        dino.isSick = false;
                        showFloatText(dino.id, "Cured!", "text-blue-400");
                        actionSuccess = true;
                    } else {
                        showFloatText(dino.id, "Not Sick!", "text-gray-400");
                    }
                } else if (state.selectedTool === 'bandage') {
                    if (dino.isInjured) {
                        state.funds -= cost;
                        dino.isInjured = false;
                        showFloatText(dino.id, "Fixed!", "text-white");
                        actionSuccess = true;
                    } else {
                        showFloatText(dino.id, "No Injury!", "text-gray-400");
                    }
                }
            } else {
                showFloatText(dino.id, "Too late...", "text-gray-500");
            }

            if (actionSuccess) {
                renderSanctuary(); // Immediate update
                updateUI();
            }
        };

        // --- Rendering ---

        function updateUI() {
            document.getElementById('funds').innerText = state.funds;
            document.getElementById('funds').className = state.funds < 100 ? "text-red-500 animate-pulse" : "text-yellow-400";
            document.getElementById('day').innerText = state.day;
            document.getElementById('dead-count').innerText = state.deadCount;
        }

        function renderSanctuary() {
            const container = document.getElementById('sanctuary');
            container.innerHTML = '';

            state.dinos.forEach((dino, index) => {
                const hpPercent = (dino.currentHp / dino.maxHp) * 100;
                const hungerPercent = dino.hunger;
                
                // Status Icons
                let statusHtml = '';
                if (dino.isDead) statusHtml = '<span class="text-2xl">☠️</span>';
                else {
                    if (dino.isSick) statusHtml += '<span class="text-xl status-icon absolute top-0 right-0">🦠</span>';
                    if (dino.isInjured) statusHtml += '<span class="text-xl status-icon absolute top-0 left-0">🤕</span>';
                    if (dino.hunger > 70) statusHtml += '<span class="text-xl status-icon absolute bottom-8 right-0">🍖</span>';
                }

                // Dynamic Classes
                let cardBg = 'bg-gray-700';
                let dinoOpacity = 'opacity-100';
                if (dino.isDead) {
                    cardBg = 'bg-gray-900 border-gray-800';
                    dinoOpacity = 'opacity-50 grayscale';
                } else if (dino.isSick || dino.isInjured || dino.hunger > 80) {
                    cardBg = 'bg-gray-700 border-red-900';
                }

                const html = `
                    <div onclick="handleDinoClick(${index})" id="dino-${dino.id}" class="dino-card relative ${cardBg} p-2 rounded pixel-border h-40 flex flex-col justify-between cursor-pointer select-none">
                        
                        <!-- Header -->
                        <div class="flex justify-between items-center text-xs text-gray-400">
                            <span>${dino.name}</span>
                            <span>${dino.isDead ? 'DEAD' : ''}</span>
                        </div>

                        <!-- Main Icon Area -->
                        <div class="relative flex justify-center items-center flex-grow">
                            <span class="text-5xl ${dinoOpacity}">${dino.icon}</span>
                            ${statusHtml}
                        </div>

                        <!-- Stats Bars -->
                        <div class="space-y-1 w-full mt-2">
                            <!-- HP Bar -->
                            <div class="w-full bg-gray-900 h-2 rounded overflow-hidden border border-gray-600">
                                <div class="h-full ${getHpColor(hpPercent)}" style="width: ${hpPercent}%"></div>
                            </div>
                            <!-- Hunger Bar (Inverse: Full is bad) -->
                            <div class="w-full bg-gray-900 h-1 rounded overflow-hidden">
                                <div class="h-full bg-orange-500" style="width: ${hungerPercent}%"></div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function getHpColor(percent) {
            if (percent > 60) return 'bg-green-500';
            if (percent > 30) return 'bg-yellow-500';
            return 'bg-red-500';
        }

        function showFloatText(dinoId, text, colorClass) {
            const dinoEl = document.getElementById(`dino-${dinoId}`);
            if (!dinoEl) return;

            const el = document.createElement('div');
            el.className = `floating-text font-bold ${colorClass}`;
            el.style.left = '50%';
            el.style.top = '20%';
            el.style.transform = 'translate(-50%, 0)';
            el.innerText = text;
            dinoEl.appendChild(el);

            setTimeout(() => el.remove(), 1000);
        }

        function showGlobalFloatText(text) {
            const container = document.getElementById('game-container');
            const el = document.createElement('div');
            el.className = "floating-text font-bold text-yellow-300 text-xl z-50";
            el.style.left = '50%';
            el.style.top = '10%';
            el.style.transform = 'translate(-50%, 0)';
            el.innerText = text;
            container.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

    </script>
</body>
</html>
