<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JUA SICK WORLD - Dinosaur Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-bg: #2d3436;
            --pixel-green: #55efc4;
            --pixel-red: #ff7675;
            --pixel-yellow: #ffeaa7;
            --pixel-dark: #1e272e;
        }
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--pixel-dark);
            color: white;
            image-rendering: pixelated;
            user-select: none;
            touch-action: manipulation; /* スマホでの操作性向上 */
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* アプリライクな挙動のため全体スクロール禁止 */
        }
        .pixel-border {
            box-shadow: 
                -4px 0 0 0 black,
                4px 0 0 0 black,
                0 -4px 0 0 black,
                0 4px 0 0 black;
            margin: 4px;
        }
        .pixel-btn {
            transition: transform 0.05s;
            cursor: pointer;
        }
        .pixel-btn:active {
            transform: translateY(2px);
            opacity: 0.8;
        }
        .dino-card {
            transition: transform 0.1s;
        }
        .dino-card:active {
            transform: scale(0.95);
        }
        /* 状態アイコンのアニメーション */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .status-icon {
            animation: bounce 1s infinite;
        }
        /* 浮き出るテキスト */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }
        .floating-text {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            font-size: 14px;
            z-index: 50;
            text-shadow: 2px 2px 0 #000;
        }
        /* スキャンラインエフェクト */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 100;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e272e; 
        }
        ::-webkit-scrollbar-thumb {
            background: #636e72; 
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-screen w-screen bg-gray-900">
    <div class="scanlines"></div>

    <!-- Game Container (App Layout) -->
    <div id="game-container" class="fixed inset-0 flex flex-col z-10 hidden bg-gray-800">
        
        <!-- Header (Fixed) -->
        <div class="shrink-0 bg-gray-900 p-2 border-b-4 border-gray-700 z-20 shadow-lg">
            <div class="flex justify-between items-center mb-1">
                <h1 class="text-xs md:text-lg text-green-400 truncate mr-2">JUA SICK WORLD</h1>
                <div class="text-xs text-blue-400 whitespace-nowrap">DAY <span id="day" class="text-white">1</span></div>
            </div>
            <div class="flex justify-between text-xs md:text-sm">
                <div class="text-yellow-400">💰 <span id="funds">1000</span></div>
                <div class="text-red-500">💀 <span id="dead-count">0</span>/3</div>
            </div>
        </div>

        <!-- Main Content (Scrollable) -->
        <div class="flex-grow overflow-y-auto p-2 pb-32 bg-gray-800">
            <div id="sanctuary" class="grid grid-cols-2 md:grid-cols-3 gap-2 md:gap-4 max-w-4xl mx-auto">
                <!-- Slots will be generated by JS -->
            </div>
        </div>

        <!-- Control Panel (Fixed Bottom) -->
        <div class="shrink-0 absolute bottom-0 left-0 right-0 bg-gray-700 p-2 border-t-4 border-gray-600 z-20 pb-safe">
            <div id="tool-info" class="text-center mb-2 text-yellow-300 text-[10px] h-3">
                <!-- Selected tool info -->
            </div>
            <div class="flex justify-around gap-1 max-w-4xl mx-auto" id="toolbar">
                <button onclick="selectTool('feed')" id="btn-feed" class="pixel-btn bg-orange-600 active:bg-orange-500 text-white p-2 rounded border-b-4 border-orange-800 w-1/4 flex flex-col items-center justify-center h-16">
                    <span class="text-2xl mb-1">🍖</span>
                    <span class="text-[10px]">餌<br>20</span>
                </button>
                <button onclick="selectTool('heal')" id="btn-heal" class="pixel-btn bg-blue-600 active:bg-blue-500 text-white p-2 rounded border-b-4 border-blue-800 w-1/4 flex flex-col items-center justify-center h-16">
                    <span class="text-2xl mb-1">💉</span>
                    <span class="text-[10px]">治療<br>50</span>
                </button>
                <button onclick="selectTool('bandage')" id="btn-bandage" class="pixel-btn bg-white active:bg-gray-200 text-gray-800 p-2 rounded border-b-4 border-gray-400 w-1/4 flex flex-col items-center justify-center h-16">
                    <span class="text-2xl mb-1">🩹</span>
                    <span class="text-[10px]">包帯<br>30</span>
                </button>
                <button onclick="selectTool('remove')" id="btn-remove" class="pixel-btn bg-gray-600 active:bg-gray-500 text-white p-2 rounded border-b-4 border-gray-800 w-1/4 flex flex-col items-center justify-center h-16">
                    <span class="text-2xl mb-1">⚰️</span>
                    <span class="text-[10px]">撤去<br>100</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="fixed inset-0 bg-gray-900 flex flex-col items-center justify-center z-50 p-4">
        <div class="w-full max-w-md bg-gray-800 p-1 rounded-lg border-4 border-gray-700 mb-6 relative">
            <!-- ユーザーの画像をここに表示。ファイル名を 'title.png' にしてください -->
            <img src="title.png" onerror="this.style.display='none'; document.getElementById('title-text').style.display='block'" class="w-full h-auto rounded block" alt="JUA SICK WORLD">
            
            <!-- 画像がない場合のフォールバックテキスト -->
            <h1 id="title-text" class="hidden text-3xl md:text-5xl text-green-500 text-center py-10" style="text-shadow: 4px 4px #000;">
                JUA SICK<br>WORLD
            </h1>
        </div>

        <button onclick="startGame()" class="pixel-btn bg-green-600 text-white py-4 px-12 rounded border-b-8 border-green-800 text-xl font-bold shadow-lg w-full max-w-xs animate-pulse mb-8">
            GAME START
        </button>

        <div class="text-gray-400 text-xs text-center leading-relaxed bg-black bg-opacity-50 p-4 rounded pixel-border max-w-md">
            <p class="mb-2 text-yellow-300">MISSION: 資金を守り恐竜を救え！</p>
            <p>🍖 餌: 空腹を回復</p>
            <p>💉 注射: 病気を治療</p>
            <p>🩹 包帯: 怪我を治療</p>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="fixed inset-0 bg-red-900 bg-opacity-95 flex flex-col items-center justify-center z-50 hidden p-4">
        <h1 class="text-4xl text-white mb-6" style="text-shadow: 4px 4px #000;">GAME OVER</h1>
        <div class="bg-black bg-opacity-50 p-6 rounded-lg text-center mb-8 border-4 border-red-700 w-full max-w-sm">
            <p class="text-sm text-gray-300 mb-2">生存記録</p>
            <p class="text-3xl text-yellow-400 mb-4"><span id="final-day">0</span> DAYS</p>
            <p id="game-over-reason" class="text-white text-xs leading-5"></p>
        </div>
        <button onclick="location.reload()" class="pixel-btn bg-white text-red-900 py-4 px-8 rounded border-b-8 border-gray-400 font-bold">
            TRY AGAIN
        </button>
    </div>

    <script>
        // --- Game Config & State ---
        const CONFIG = {
            initialFunds: 1000,
            incomePerDino: 50,
            maxDead: 3,
            tickRate: 2000,
            costs: {
                feed: 20,
                heal: 50,
                bandage: 30,
                remove: 100
            }
        };

        let state = {
            funds: 0,
            day: 1,
            deadCount: 0,
            dinos: [],
            selectedTool: null,
            gameInterval: null,
            dayInterval: null,
            isPlaying: false
        };

        const DINO_TYPES = [
            { name: 'Rex', icon: '🦖', hp: 100, maxHp: 100 },
            { name: 'Sauro', icon: '🦕', hp: 120, maxHp: 120 },
            { name: 'Trike', icon: '🐗', hp: 80, maxHp: 80 },
            { name: 'Raptor', icon: '🦎', hp: 60, maxHp: 60 }
        ];

        // --- Core Functions ---

        function initGame() {
            state.funds = CONFIG.initialFunds;
            state.day = 1;
            state.deadCount = 0;
            state.dinos = Array(6).fill(null).map(() => createRandomDino());
            state.selectedTool = null;
            state.isPlaying = true;

            updateUI();
            renderSanctuary();
            
            state.gameInterval = setInterval(gameTick, CONFIG.tickRate);
            state.dayInterval = setInterval(advanceDay, 10000);
        }

        function createRandomDino() {
            const type = DINO_TYPES[Math.floor(Math.random() * DINO_TYPES.length)];
            return {
                id: Math.random().toString(36).substr(2, 9),
                ...type,
                currentHp: type.hp,
                hunger: 0,
                isSick: false,
                isInjured: false,
                isDead: false
            };
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            initGame();
        }

        function gameOver(reason) {
            state.isPlaying = false;
            clearInterval(state.gameInterval);
            clearInterval(state.dayInterval);
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-day').innerText = state.day;
            document.getElementById('game-over-reason').innerText = reason;
        }

        // --- Game Logic ---

        function gameTick() {
            if (!state.isPlaying) return;

            state.dinos.forEach(dino => {
                if (dino.isDead) return;

                dino.hunger += 5;
                if (dino.hunger >= 100) {
                    dino.hunger = 100;
                    dino.currentHp -= 10;
                }

                if (!dino.isSick && Math.random() < 0.1) {
                    dino.isSick = true;
                    showFloatText(dino.id, "SICK!", "text-purple-400");
                }
                if (dino.isSick) dino.currentHp -= 5;

                if (!dino.isInjured && Math.random() < 0.08) {
                    dino.isInjured = true;
                    showFloatText(dino.id, "OUCH!", "text-red-400");
                }
                if (dino.isInjured) dino.currentHp -= 8;

                if (dino.currentHp <= 0) {
                    dino.currentHp = 0;
                    dino.isDead = true;
                    state.deadCount++;
                    showFloatText(dino.id, "DIED...", "text-gray-500");
                    checkGameOver();
                }
            });

            renderSanctuary();
            updateUI();
        }

        function advanceDay() {
            if (!state.isPlaying) return;
            state.day++;
            
            let income = 0;
            state.dinos.forEach(dino => {
                if (!dino.isDead && !dino.isSick && !dino.isInjured && dino.hunger < 50) {
                    income += CONFIG.incomePerDino;
                }
            });
            
            if (income > 0) {
                state.funds += income;
                showGlobalFloatText(`+$${income}`);
            }

            updateUI();
        }

        function checkGameOver() {
            if (state.deadCount >= CONFIG.maxDead) {
                gameOver("飼育崩壊: 恐竜が死にすぎました");
            } else if (state.funds < 0) {
                gameOver("資金不足: 運営費が尽きました");
            }
        }

        // --- Interaction ---

        function selectTool(toolName) {
            state.selectedTool = toolName;
            
            // Reset button styles
            ['feed', 'heal', 'bandage', 'remove'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                btn.classList.remove('ring-4', 'ring-yellow-400', 'translate-y-1');
            });

            if (toolName) {
                const btn = document.getElementById(`btn-${toolName}`);
                btn.classList.add('ring-4', 'ring-yellow-400');
                
                // Add bounce effect to show selection
                btn.classList.add('scale-105');
                setTimeout(() => btn.classList.remove('scale-105'), 100);

                const labels = {
                    'feed': '選択中: 餌をあげる',
                    'heal': '選択中: 病気を治す',
                    'bandage': '選択中: 怪我を治す',
                    'remove': '選択中: 遺体を撤去'
                };
                document.getElementById('tool-info').innerText = labels[toolName];
            }
        }

        window.handleDinoClick = function(index) {
            if (!state.isPlaying || !state.selectedTool) return;

            const dino = state.dinos[index];
            const cost = CONFIG.costs[state.selectedTool];

            // Feedback for tap
            const card = document.getElementById(`dino-${dino.id}`);
            card.classList.add('brightness-125');
            setTimeout(() => card.classList.remove('brightness-125'), 100);

            if (state.funds < cost) {
                showFloatText(dino.id, "NO MONEY", "text-red-500");
                return;
            }

            let actionSuccess = false;

            if (state.selectedTool === 'remove') {
                if (dino.isDead) {
                    state.funds -= cost;
                    state.dinos[index] = createRandomDino();
                    showFloatText(state.dinos[index].id, "NEW!", "text-green-400");
                    actionSuccess = true;
                } else {
                    showFloatText(dino.id, "ALIVE!", "text-white");
                }
            } else if (!dino.isDead) {
                if (state.selectedTool === 'feed') {
                    if (dino.hunger > 0) {
                        state.funds -= cost;
                        dino.hunger = Math.max(0, dino.hunger - 50);
                        dino.currentHp = Math.min(dino.maxHp, dino.currentHp + 10);
                        showFloatText(dino.id, "YUM!", "text-green-400");
                        actionSuccess = true;
                    } else {
                        showFloatText(dino.id, "FULL!", "text-gray-400");
                    }
                } else if (state.selectedTool === 'heal') {
                    if (dino.isSick) {
                        state.funds -= cost;
                        dino.isSick = false;
                        showFloatText(dino.id, "CURED!", "text-blue-400");
                        actionSuccess = true;
                    } else {
                        showFloatText(dino.id, "HEALTHY!", "text-gray-400");
                    }
                } else if (state.selectedTool === 'bandage') {
                    if (dino.isInjured) {
                        state.funds -= cost;
                        dino.isInjured = false;
                        showFloatText(dino.id, "FIXED!", "text-white");
                        actionSuccess = true;
                    } else {
                        showFloatText(dino.id, "OK!", "text-gray-400");
                    }
                }
            } else {
                showFloatText(dino.id, "...", "text-gray-500");
            }

            if (actionSuccess) {
                renderSanctuary();
                updateUI();
            }
        };

        // --- Rendering ---

        function updateUI() {
            document.getElementById('funds').innerText = state.funds;
            document.getElementById('funds').className = state.funds < 100 ? "text-red-500 animate-pulse font-bold" : "text-yellow-400 font-bold";
            document.getElementById('day').innerText = state.day;
            document.getElementById('dead-count').innerText = state.deadCount;
        }

        function renderSanctuary() {
            const container = document.getElementById('sanctuary');
            container.innerHTML = '';

            state.dinos.forEach((dino, index) => {
                const hpPercent = (dino.currentHp / dino.maxHp) * 100;
                const hungerPercent = dino.hunger;
                
                let statusHtml = '';
                if (dino.isDead) statusHtml = '<span class="text-3xl filter drop-shadow-md">☠️</span>';
                else {
                    if (dino.isSick) statusHtml += '<span class="text-xl status-icon absolute top-0 right-0 filter drop-shadow-md">🦠</span>';
                    if (dino.isInjured) statusHtml += '<span class="text-xl status-icon absolute top-0 left-0 filter drop-shadow-md">🤕</span>';
                    if (dino.hunger > 70) statusHtml += '<span class="text-xl status-icon absolute bottom-8 right-0 filter drop-shadow-md">🍖</span>';
                }

                let cardBg = 'bg-gray-700';
                let dinoOpacity = 'opacity-100';
                if (dino.isDead) {
                    cardBg = 'bg-gray-900 border-gray-800';
                    dinoOpacity = 'opacity-40 grayscale';
                } else if (dino.isSick || dino.isInjured || dino.hunger > 80) {
                    cardBg = 'bg-gray-700 border-red-900';
                }

                const html = `
                    <div onclick="handleDinoClick(${index})" id="dino-${dino.id}" class="dino-card relative ${cardBg} p-2 rounded pixel-border h-36 flex flex-col justify-between cursor-pointer select-none shadow-md overflow-hidden">
                        
                        <div class="flex justify-between items-center text-[10px] text-gray-400 font-bold">
                            <span class="truncate">${dino.name}</span>
                            <span>${dino.isDead ? 'DEAD' : ''}</span>
                        </div>

                        <div class="relative flex justify-center items-center flex-grow -mt-2">
                            <span class="text-5xl ${dinoOpacity} filter drop-shadow-lg transform transition-transform">${dino.icon}</span>
                            ${statusHtml}
                        </div>

                        <div class="space-y-1 w-full mt-1">
                            <div class="w-full bg-gray-900 h-2 rounded overflow-hidden border border-gray-600 relative">
                                <div class="h-full ${getHpColor(hpPercent)} transition-all duration-300" style="width: ${hpPercent}%"></div>
                            </div>
                            <div class="w-full bg-gray-900 h-1.5 rounded overflow-hidden relative">
                                <div class="h-full bg-orange-500 transition-all duration-300" style="width: ${hungerPercent}%"></div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function getHpColor(percent) {
            if (percent > 60) return 'bg-green-500';
            if (percent > 30) return 'bg-yellow-500';
            return 'bg-red-500';
        }

        function showFloatText(dinoId, text, colorClass) {
            const dinoEl = document.getElementById(`dino-${dinoId}`);
            if (!dinoEl) return;

            const el = document.createElement('div');
            el.className = `floating-text font-bold ${colorClass}`;
            el.style.left = '50%';
            el.style.top = '30%';
            el.style.transform = 'translate(-50%, 0)';
            el.innerText = text;
            dinoEl.appendChild(el);

            setTimeout(() => el.remove(), 800);
        }

        function showGlobalFloatText(text) {
            const container = document.getElementById('game-container');
            const el = document.createElement('div');
            el.className = "floating-text font-bold text-yellow-300 text-2xl z-50 shadow-black drop-shadow-md";
            el.style.left = '50%';
            el.style.top = '15%'; // ヘッダーとかぶらない位置
            el.style.transform = 'translate(-50%, 0)';
            el.innerText = text;
            container.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

    </script>
</body>
</html>
